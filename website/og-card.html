<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Jost:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0d1322;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(242, 146, 31, 0.28), transparent 58%),
          #0d1322;
        color: #f6efe2;
        font-family: Jost, "Avenir Next", sans-serif;
      }
      .card {
        width: 1040px;
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 48px;
        align-items: center;
      }
      .wordmark {
        display: block;
        width: 430px;
        height: auto;
        margin: 0 0 28px;
      }
      h1 {
        margin: 0;
        font-family: Fraunces, "Iowan Old Style", serif;
        font-weight: 520;
        font-size: 84px;
        line-height: 0.92;
        letter-spacing: -0.035em;
      }
      .facts {
        margin: 20px 0 0;
        color: #ffb568;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }
      p {
        margin: 10px 0 0;
        color: #cfc4ac;
        font-size: 24px;
        line-height: 1.35;
        white-space: nowrap;
      }
      .icon {
        width: 280px;
        height: 280px;
        border-radius: 64px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <img class="wordmark" src="public/brand/wordmark-neon.svg" alt="" />
        <h1>Set the mood.<br />Let it play.</h1>
        <p class="facts">Free. Open source. No ads.<br />No accounts. No subscriptions.</p>
        <p>Long-form music mixes for your home speakers.</p>
      </div>
      <img class="icon" src="../assets/branding/Moozaq-AppIcon-B/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" alt="" />
    </div>
  </body>
</html>

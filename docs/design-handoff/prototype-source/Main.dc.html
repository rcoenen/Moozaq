          showPlay: !starting && !nowPlaying, showPause: !starting && nowPlaying,
          isNow: isNow,
          badgeText: nowPlaying ? "Now playing" : "Paused",
          eqClass: "mz-eq" + (nowPlaying ? "" : " mz-paused"),
          previewLabel: "Preview " + m.title,
          playLabel: (starting ? "Starting " : nowPlaying ? "Pause " : isNow ? "Resume " : "Play ") + m.title,
          preview: () => this.setState({ preview: key }),
          play: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (isNow) this.toggle(); else this.play(m, key); }
        });
      })
    }));

    const r = st.receiver, t = st.transport;
    const awaiting = !!t;
    const cap = (x) => x ? x.charAt(0) + x.slice(1).toLowerCase() : "";
    const statusText = awaiting ? cap(t.previous) : (r === "IDLE" ? "Idle" : cap(r));
    const canToggle = r === "PLAYING" || r === "PAUSED";
    const toggleLabel = awaiting
      ? (t.expected === "PAUSED" ? "Pausing…" : t.expected === "IDLE" ? "Stopping…" : "Starting…")
      : (r === "PLAYING" ? "Pause" : "Resume");

    const seekValue = st.seekDrag ?? st.seekPending ?? st.position;
    const seekTint = st.seekPending != null ? "#BFC7D9" : "#FFB872";
    const volValue = st.volDrag ?? st.volPending ?? st.volume;
    const volTint = st.volPending != null ? "#BFC7D9" : "#FFB872";

    const isIdle = r === "IDLE" && !t;
    const last = st.now;
    return {
      shelves: shelves,
      now: st.now || {},
      isIdle: isIdle, active: !isIdle,
      hasLast: !!last, noLast: !last,
      lastCover: last ? last.cover : "",
      idleHint: last ? "Last played: " + last.title : "Pick a mix above to start playing on Office speaker",
      playAgain: () => { if (last) this.play(last, "again"); },
      playAgainBusy: !!st.starting,
      playAgainLabel: st.starting === "again" ? "Starting…" : "Play again",
      chipLead: isIdle ? "Cast to" : "Casting to",
      chipIcon: isIdle ? "#BFC7D9" : "#A2D2A3",
      chipFrame: isIdle ? "transparent" : "#A2D2A3",
      chipAria: (isIdle ? "Cast to" : "Casting to") + " Office speaker. Choose devices",
      statusText: statusText,
      statusLine: st.seekPending != null ? "Seeking…" : statusText + " · " + ((st.now && st.now.creator) || ""),
      showPlayAgain: isIdle && !!last,
      awaiting: awaiting || !canToggle,
      toggleLabel: toggleLabel,
      toggleBg: awaiting ? "#BFC7D9" : canToggle ? "#FFB872" : "#31353C",
      toggleFg: awaiting ? "#10131A" : canToggle ? "#4A2800" : "#E0E2EC",
      toggle: () => this.toggle(),
      stop: () => this.stop(),
      elapsed: clock(seekValue),
      total: clock(st.duration),
      duration: st.duration,
      seekValue: seekValue,
      seekPending: st.seekPending != null,
      seekLocked: st.seekPending != null || r === "IDLE",
      seek: track(seekValue / st.duration, seekTint),
      seekInput: (e) => this.setState({ seekDrag: Number(e.target.value) }),
      seekCommit: () => {
        if (st.seekDrag == null) return;
        const target = this.state.seekDrag;
        this.setState({ seekDrag: null, seekPending: target });
        this.later(1100, () => this.setState({ position: target, seekPending: null }));
      },
      volValue: volValue,
      volLocked: st.volPending != null,
      vol: track(volValue / 100, volTint),
      volLabel: st.volPending != null ? "Syncing…" : "Volume",
      volLabelColor: st.volPending != null ? "#BFC7D9" : "#E0E2EC",
      volInput: (e) => this.setState({ volDrag: Number(e.target.value) }),
      volCommit: () => {
        if (st.volDrag == null) return;
        const target = this.state.volDrag;
        this.setState({ volDrag: null, volPending: target });
        this.later(900, () => this.setState({ volume: target, volPending: null }));
      }
    };
  }
}
</script>
</body>
</html>

<head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E15}
a{color:#FFB872}a:hover{color:#FFDCBE}
.ma-root{font-family:"Roboto Flex",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.ma-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}

.ma-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ma-num{font-variant-numeric:tabular-nums}
.ma-btn{cursor:pointer}
.ma-btn:disabled{cursor:default}
@keyframes ma-spin{to{transform:rotate(360deg)}}
.ma-spin{animation:ma-spin 1s linear infinite}
</style>
</helmet>
<div class="ma-root" style="position: relative; width: 412px; height: 915px; overflow: hidden; background: #0B0E15; color: #E0E2EC; display: flex; flex-direction: column; padding: 0 24px 32px; box-sizing: border-box">

  <div style="height: 64px; flex-shrink: 0; margin: 0 -16px; display: flex; align-items: center">

    </a>
    <div style="flex: 1; min-width: 0; text-align: center">
      <div style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; color: #BFC7D9">Casting to</div>
      <div style="font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: #E0E2EC">Bedroom speaker</div>
    </div>
    <a href="AndroidCast.dc.html" class="ma-icon-btn" aria-label="Casting to Bedroom speaker. Choose devices">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#A2D2A3" d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm18-7H5v1.63c3.96 1.28 7.09 4.41 8.37 8.37H19V7zM1 10v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"></path></svg>
    </a>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center">
    <img src="/_blob/c948ed1d75eab7e14b41f37b9ae8ca9b" alt="" style="width: 364px; height: 205px; border-radius: 16px; object-fit: cover; display: block">

    <div style="margin-top: 32px">
      <div class="ma-clamp" style="font-size: 22px; line-height: 28px; font-weight: 600; color: #E0E2EC">Dark Jazz &amp; Cinematic Trip-Hop // Midnight Fever Motel // Dawn Is Still Hours Away</div>
      <div style="margin-top: 4px; font-size: 16px; line-height: 24px; letter-spacing: 0.5px; color: #BFC7D9">Jazz Haze · {{statusText}}</div>
    </div>

    <div style="margin-top: 24px; position: relative; height: 44px">
      <div style="position: absolute; top: 14px; left: 0; height: 16px; width: {{seek.activeW}}; background: {{seek.tint}}; border-radius: 8px 2px 2px 8px"></div>
      <div style="position: absolute; top: 0; left: {{seek.thumbL}}; width: 4px; height: 44px; border-radius: 2px; background: {{seek.tint}}"></div>
      <div style="position: absolute; top: 14px; left: {{seek.inL}}; right: 0; height: 16px; background: #59422D; border-radius: 2px 8px 8px 2px"></div>
      <input class="ma-range" type="range" min="0" max="{{duration}}" step="1" value="{{seekValue}}" aria-label="Playback position" disabled="{{seekLocked}}" onChange="{{seekInput}}" onPointerUp="{{seekCommit}}" onKeyUp="{{seekCommit}}">
    </div>
    <div class="ma-num" style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; color: #BFC7D9">
      <span>{{elapsed}}</span>
      <span>{{total}}</span>
    </div>

    <div style="margin-top: 24px; display: flex; justify-content: center">
      <button class="ma-btn" type="button" aria-label="{{toggleAria}}" disabled="{{awaiting}}" onClick="{{toggle}}" style="width: 96px; height: 96px; border: 0; padding: 0; border-radius: 28px; background: {{fabBg}}; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{awaiting}}" hint-placeholder-val="{{false}}">
          <svg class="ma-spin" width="36" height="36" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="#4A2800" stroke-width="2" stroke-dasharray="40 100" stroke-linecap="round"></circle></svg>
        </sc-if>
        <sc-if value="{{showPause}}" hint-placeholder-val="{{true}}">
          <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4A2800" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
        </sc-if>
        <sc-if value="{{showPlay}}" hint-placeholder-val="{{false}}">
          <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4A2800" d="M8 5v14l11-7z"></path></svg>
        </sc-if>
      </button>
    </div>

    <div style="margin-top: 32px; display: flex; align-items: center; gap: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#BFC7D9" d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"></path></svg>
      <div style="position: relative; height: 44px; flex: 1">
        <div style="position: absolute; top: 16px; left: 0; height: 12px; width: {{vol.activeW}}; background: {{vol.tint}}; border-radius: 6px 2px 2px 6px"></div>
        <div style="position: absolute; top: 6px; left: {{vol.thumbL}}; width: 4px; height: 32px; border-radius: 2px; background: {{vol.tint}}"></div>
        <div style="position: absolute; top: 16px; left: {{vol.inL}}; right: 0; height: 12px; background: #59422D; border-radius: 2px 6px 6px 2px"></div>
        <input class="ma-range" type="range" min="0" max="100" step="1" value="{{volValue}}" aria-label="Volume" disabled="{{volLocked}}" onChange="{{volInput}}" onPointerUp="{{volCommit}}" onKeyUp="{{volCommit}}">
      </div>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#BFC7D9" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>
    </div>
  </div>

  <a href="AndroidIdle.dc.html" style="height: 48px; flex-shrink: 0; border-radius: 24px; border: 1px solid #8991A2; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: #FFB872; text-decoration: none">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFB872" d="M6 6h12v12H6z"></path></svg>
    Stop casting
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
function clock(t) {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const ss = String(s).padStart(2, "0");
  return h > 0 ? h + ":" + String(m).padStart(2, "0") + ":" + ss : m + ":" + ss;
}
function track(f, tint) {
  f = Math.min(1, Math.max(0, f));
  return { tint: tint, activeW: "calc(" + f + " * (100% - 4px) - 6px)", thumbL: "calc(" + f + " * (100% - 4px))", inL: "calc(" + f + " * (100% - 4px) + 10px)" };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { receiver: "PLAYING", position: 3642, duration: 5567, transport: null, seekDrag: null, seekPending: null, volume: 40, volDrag: null, volPending: null };
  }
  componentDidMount() {
    this.tick = setInterval(() => {
      if (this.state.receiver === "PLAYING" && this.state.seekPending == null) this.setState({ position: Math.min(this.state.duration, this.state.position + 1) });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.tick); (this.timers || []).forEach(clearTimeout); }
  later(ms, fn) { this.timers = this.timers || []; this.timers.push(setTimeout(fn, ms)); }

  toggle() {
    if (this.state.transport) return;
    const pausing = this.state.receiver === "PLAYING";
    this.setState({ transport: pausing ? "PAUSED" : "PLAYING" });
    this.later(1300, () => this.setState({ receiver: pausing ? "PAUSED" : "PLAYING", transport: null }));
  }

  renderVals() {
    const st = this.state;
    const awaiting = !!st.transport;
    const playing = st.receiver === "PLAYING";
    const seekValue = st.seekDrag ?? st.seekPending ?? st.position;
    const volValue = st.volDrag ?? st.volPending ?? st.volume;
    let statusText = playing ? "Playing" : "Paused";
    if (awaiting) statusText = st.transport === "PAUSED" ? "Pausing…" : "Resuming…";
    if (st.seekPending != null) statusText = "Seeking…";
    return {
      statusText: statusText,
      awaiting: awaiting,
      showPause: !awaiting && playing, showPlay: !awaiting && !playing,
      fabBg: awaiting ? "#BFC7D9" : "#FFB872",
      toggleAria: playing ? "Pause" : "Resume",
      toggle: () => this.toggle(),
      elapsed: clock(seekValue), total: clock(st.duration),
      duration: st.duration, seekValue: seekValue,
      seekLocked: st.seekPending != null,
      seek: track(seekValue / st.duration, st.seekPending != null ? "#BFC7D9" : "#FFB872"),
      seekInput: (e) => this.setState({ seekDrag: Number(e.target.value) }),
      seekCommit: () => {
        const v = this.state.seekDrag;
        if (v == null) return;
        this.setState({ seekDrag: null, seekPending: v });
        this.later(1100, () => this.setState({ position: v, seekPending: null }));
      },
      volValue: volValue,
      volLocked: st.volPending != null,
      vol: track(volValue / 100, st.volPending != null ? "#BFC7D9" : "#FFB872"),
      volInput: (e) => this.setState({ volDrag: Number(e.target.value) }),
      volCommit: () => {
        const v = this.state.volDrag;
        if (v == null) return;
        this.setState({ volDrag: null, volPending: v });
        this.later(900, () => this.setState({ volume: v, volPending: null }));
      }
    };
  }
}
</script>

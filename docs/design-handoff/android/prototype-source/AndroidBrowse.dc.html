]}, {"name": "Desert / Psychedelia", "mixes": [{"title": "THE LAST RUN TO ELKO | Spaghetti Western Surf, Desert Exotica & Cold War Noir", "creator": "Noir Tiki Lounge", "cover": "/_blob/0f615dc275dd1ef07c4f36ca6c535e54"}, {"title": "THE SCORPION'S LAIR – Hypnotic Desert Noir & Dark Arabic Exotica (High Fidelity Stereo)", "creator": "Noir Tiki Lounge", "cover": "/_blob/ad6cc78bdd172cadb6c241ef375de1b3"}, {"title": "Midnight Séance | Psychedelic Vintage Dark Exotica Lounge", "creator": "Noir Tiki Lounge", "cover": "/_blob/07cfb2ae17884cc23ba0c0d0ab237092"}, {"title": "Cosmic Mirage| Psychedelic Vintage Dark Exotica Lounge", "creator": "Noir Tiki Lounge", "cover": "/_blob/049d040b6b07c5a3d74f7ca5769cbdcc"}, {"title": "SPAGHETTI CUMBIA | Desert Noir & Psychedelic Vintage Lounge", "creator": "Noir Tiki Lounge", "cover": "/_blob/eccab436fab76b20ee2a82cad55c0f44"}, {"title": "THE FARFISA MIRAGE | Psychedelic 60s Vintage Lounge & Hypnotic Organ", "creator": "Noir Tiki Lounge", "cover": "/_blob/46574b3c62e5ed0a8a538978d7b7f2d8"}]}, {"name": "Noir Jazz", "mixes": [{"title": "This Suits Me. – Smoky Noir Jazz for Quiet City Nights", "creator": "Sepia Lounge", "cover": "/_blob/89d76d27ddf1a0c0925ac69f71b3670c"}, {"title": "Keeping You Company. – Chill Vintage Noir Jazz to Relax & Unwind", "creator": "Sepia Lounge", "cover": "/_blob/13108a7f66e34c57e6cfc6bd263ae914"}, {"title": "I’m Staying Put. – Cozy, Quiet Vintage Noir Jazz for Relaxation & Unwinding", "creator": "Sepia Lounge", "cover": "/_blob/b28a0e9fd7106a6ed83b2776576621de"}, {"title": "Plenty of Time. – Chill Vintage Noir Jazz to Relax & Unwind", "creator": "Sepia Lounge", "cover": "/_blob/8a273d8a0f23d84c0cbf310a48a1b05f"}, {"title": "Vintage Noir Jazz for Quiet Nights – The World Can Wait.", "creator": "Sepia Lounge", "cover": "/_blob/21173e0a779d612cb923b83a7b6c8555"}, {"title": "Ease Into It. – Warm Vintage Noir Jazz for Quiet Moments", "creator": "Sepia Lounge", "cover": "/_blob/085ca9d60b87899c4c5d39438fab4ada"}]}];
const DEVICE = "Bedroom speaker";

function initial(mode) {

    receiver: mode === "playing" ? "PLAYING" : "IDLE",
    position: mode === "playing" ? 3642 : 0, duration: 5567,
    transport: null, starting: null
